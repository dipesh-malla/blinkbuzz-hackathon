# Supabase pauses Free projects after about a week with little database activity.
# This reads the editions table every 3 days so the backend never goes to sleep
# between events. It uses the public anon key, so it can only read public data.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase
        run: |
          curl -sS -f "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/editions?select=id&limit=1" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_ANON_KEY }}"
